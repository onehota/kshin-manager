<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق KShin File Manager</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #03A9F4;
            --primary-hover: #0288D1;
            --text-color: #333333;
            --subtext-color: #666666;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
        }

        .app-icon {
            width: 88dp;
            height: 88px;
            background-color: var(--primary);
            border-radius: 20px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(3, 169, 244, 0.3);
        }

        h1 {
            font-size: 22px;
            margin: 0 0 8px;
        }

        p.version {
            color: var(--subtext-color);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .features {
            text-align: right;
            margin-bottom: 28px;
            background: #e1f5fe;
            padding: 16px;
            border-radius: 12px;
        }

        .features ul {
            margin: 0;
            padding-right: 20px;
            font-size: 14px;
            color: #0277bd;
        }

        .features li {
            margin-bottom: 8px;
        }

        .btn-download {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            font-size: 16px;
            transition: background 0.3s ease;
            box-sizing: border-box;
        }

        .btn-download:hover {
            background-color: var(--primary-hover);
        }

        .footer-note {
            font-size: 12px;
            color: var(--subtext-color);
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-icon">📁</div>
    <h1>KShin File Manager</h1>
    <p class="version">الإصدار v1.0.0 (Android)</p>

    <div class="features">
        <ul>
            <li>إدارة ملفات سريعة وسلسة</li>
            <li>بحث متقدم وبدون تجميد للشاشة</li>
            <li>عرض ملفات SVG بدون إنترنت</li>
            <li>انتقال مباشر للمسارات</li>
        </ul>
    </div>

    <!-- رابط التحميل المباشر لملف APK -->
    <a href="kshin-manager.apk" class="btn-download" download>
        ⬇️ تحميل التطبيق (APK)
    </a>

    <p class="footer-note">آمن ومفحوص 100% | يتطلب نظام أندرويد</p>
</div>

</body>
</html>
